name: Feishu connector

on:
  pull_request:
    paths:
      - 'tools/mika-feishu/**'
      - '.github/workflows/feishu-connector.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mika-feishu/**'
      - '.github/workflows/feishu-connector.yml'

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ./tools/mika-feishu
      - run: python -m unittest discover -s tools/mika-feishu/tests -v
