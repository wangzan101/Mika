services:
  envd:
    build: .
    restart: unless-stopped
    command:
      - -listen
      - 0.0.0.0:8787
      - -data
      - /data
      - -token-env
      - ENVD_TOKEN
      - -exec-user
      - "10002"
      - -exec-group
      - "10001"
    environment:
      ENVD_TOKEN: ${ENVD_TOKEN:?Set ENVD_TOKEN in .env}
    volumes:
      - envd_data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:8787:8787"

volumes:
  envd_data:
